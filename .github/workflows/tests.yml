name: tests

on:
  push:
    branches: [main, V2.1.1-demo]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          # The demo extra pulls scipy and matplotlib; the estimator and the
          # plotter are tested here, so the core-only install is not enough.
          pip install -e ".[demo]"
          pip install pytest
      - name: tests
        run: pytest -q

  core-only:
    # The core package declares numpy alone. This job proves that promise holds
    # even on the demo branch: no scipy, no matplotlib, audit still runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install without extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: core tests only
        run: pytest -q tests/test_core.py tests/test_agent.py
      - name: audit runs without scipy
        run: |
          python - <<'PY'
          import numpy as np
          from leakage_audit import Audit
          x = np.random.default_rng(0).normal(size=2000)
          res = Audit().run(x, fs=500, band=20, rates=[250.0, 125.0, 62.5])
          assert res.rows, "no rows"
          assert "scipy" in res.fit_note, res.fit_note
          print("core audit ok;", res.fit_note)
          PY

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[demo]"
      - name: cli entry points exist
        run: |
          leakage-audit --help
          invariance-agent schema > schema.json
          python -c "import json; d = json.load(open('schema.json')); assert d['actions'], 'empty contract'"
      - name: demo tutorial runs end to end
        run: |
          python examples/v2_demo_tutorial.py --out demo.png
          test -s demo.png
